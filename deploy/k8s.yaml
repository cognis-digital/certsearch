apiVersion: apps/v1
kind: Deployment
metadata: { name: certsearch, labels: { app: certsearch } }
spec:
  replicas: 1
  selector: { matchLabels: { app: certsearch } }
  template:
    metadata: { labels: { app: certsearch } }
    spec:
      containers:
        - name: certsearch
          image: ghcr.io/cognis-digital/certsearch:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: certsearch }
spec:
  selector: { app: certsearch }
  ports: [{ port: 80, targetPort: 8000 }]
